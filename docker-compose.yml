services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    image: quantumfinances-backend:latest
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.5}
      QUANTUMFINANCES_REQUEST_TIMEOUT_SECONDS: ${QUANTUMFINANCES_REQUEST_TIMEOUT_SECONDS:-90}
      SOURCE_BASE_URL: ${SOURCE_BASE_URL:-}
      SOURCE_SNAPSHOT_MANIFEST_URL: ${SOURCE_SNAPSHOT_MANIFEST_URL:-}
      SOURCE_SNAPSHOT_URLS: ${SOURCE_SNAPSHOT_URLS:-}
    expose:
      - "8088"
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    image: quantumfinances-frontend:latest
    depends_on:
      - backend
    ports:
      - "${QFIN_WEB_PORT:-8080}:80"
    restart: unless-stopped
